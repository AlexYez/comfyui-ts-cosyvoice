[project]
name = "comfyui-ts-cosyvoice"
description = "TS CosyVoice3 - Advanced Text-to-Speech nodes for ComfyUI. Features zero-shot voice cloning, cross-lingual synthesis, instruction-based control, and voice conversion using the CosyVoice3 model family. Supports 9 languages and 18+ Chinese dialects with automatic model downloading and caching."
version = "1.2.0"
license = "MIT"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "modelscope",
    "huggingface_hub",
    "transformers>=4.40.0",
    "soundfile>=0.12.0",
    # Imported at model-load time by the vendored tree, and declared explicitly
    # because every other package here lists them only under an extra:
    #   scipy      — cosyvoice/hifigan/generator.py, the HiFT vocoder. It used to
    #                arrive transitively with librosa; librosa is now optional.
    #   matplotlib — via cosyvoice/hifigan/hifigan.py -> matcha/hifigan/xutils.py,
    #                reached while the shipped cosyvoice3.yaml is parsed.
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    # Floored only, deliberately. Nothing on the synthesis path needs numba, so
    # there is no NumPy ceiling to impose — the pack computes its own mel
    # spectrograms (utils/ts_mel.py). ComfyUI ships NumPy 2.5; capping it here
    # would constrain a shared environment for no benefit.
    "numpy>=1.24.0",
    "tqdm",
    "onnxruntime>=1.18.0",
    "requests",
    "HyperPyYAML>=1.2.0",
    "ruamel.yaml<0.18",
    "conformer>=0.3.2",
    "omegaconf>=2.3.0",
    "inflect>=7.0.0",
    "hydra-core>=1.3.0",
    "pydantic>=2.0.0",
    "x-transformers>=2.0.0",
    "diffusers>=0.29.0",
    "wetext",
    "pyarrow>=14.0.0",
    "regex",
    "einops",
    "tiktoken"
]

# Nothing below is needed to load a model or synthesise. Each extra is optional
# for a stated reason, not by oversight.
#
# transcription — openai-whisper, for turning the reference audio into
#   reference_text automatically in the Save Speaker and Dialog nodes. Optional
#   because it depends on numba, and numba refuses to load against NumPy 2.2+
#   while current ComfyUI ships 2.5; requiring it would either drag a shared
#   NumPy backwards or break the pack outright. Without it those nodes behave as
#   before except that you type reference_text yourself.
#
#     pip install "comfyui-ts-cosyvoice[transcription]"
#
# world-pitch — pyworld, for the formant-preserving pitch shift in the voice
#   conversion node. It publishes wheels for Windows only (0.3.5 ships
#   win_amd64/win32 and an sdist, nothing for macOS or Linux), so requiring it
#   makes `pip install` build a C++ extension — which fails outright on a Mac
#   without the Xcode Command Line Tools, before ComfyUI even starts. Without it
#   the node falls back to a phase vocoder and logs which path it took.
#
#     pip install "comfyui-ts-cosyvoice[world-pitch]"
[project.optional-dependencies]
world-pitch = ["pyworld>=0.3.0"]
transcription = ["openai-whisper", "librosa>=0.10.0", "numpy<2.2"]

[project.urls]
Repository = "https://github.com/AlexYez/comfyui-ts-cosyvoice"

[tool.comfy]
PublisherId = "timesaver"
DisplayName = "ComfyUI TS CosyVoice RU Edition"
Icon = "https://raw.githubusercontent.com/AlexYez/comfyui-ts-cosyvoice/refs/heads/main/icon.svg"
requires-comfyui = ">=0.3.40"
